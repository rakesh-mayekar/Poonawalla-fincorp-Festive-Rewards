<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Poonawalla Fincorp - Festive Rewards & Offers Hub (Wireframe Edition)</title>
  <meta name="description" content="Explore Poonawalla Fincorp's Festive Rewards Hub wireframe prototype featuring Quick Loans, Play & Win games, Pre-approved loans, and partner vouchers.">
  <meta name="theme-color" content="#18181B">

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            wf: {
              bg: '#F8F9FA',
              surface: '#FFFFFF',
              card: '#FFFFFF',
              border: '#E4E4E7',
              borderDark: '#D4D4D8',
              dark: '#18181B',
              darkHover: '#27272A',
              muted: '#F4F4F5',
              mutedHover: '#E4E4E7',
              text: '#09090B',
              subtext: '#71717A',
              accent: '#3F3F46'
            }
          },
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-wf-bg text-wf-text font-sans antialiased selection:bg-wf-dark selection:text-white overflow-x-hidden">

  <!-- Main Web App Mounting Container -->
  <div id="app" class="min-h-screen flex flex-col relative"></div>

  <!-- JavaScript Main Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
